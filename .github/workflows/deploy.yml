name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # publishing the GitHub release
  id-token: write # keyless sign-in to GCP via Workload Identity Federation

env:
  REGION: europe-west1
  SERVICE: secret-santa-bot
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/cloud-run-source-deploy/secret-santa-bot:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        run: |
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Only the image changes: the service account, the token secret and the limits stay as configured.
      - name: Deploy to Cloud Run
        run: gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "${{ vars.GCP_PROJECT_ID }}" --quiet

      # Every successful deploy becomes a release: the patch number grows by one,
      # or the minor/major one if the commit message contains [minor] or [major].
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          released=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .target_commitish 2>/dev/null || true)
          if [[ "$released" == "$GITHUB_SHA" ]]; then
            echo "This commit is already released as $latest (workflow re-run)."
            exit 0
          fi
          version=$(bash .github/scripts/next-version.sh "$latest" "$COMMIT_MESSAGE")
          if [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            notes=$(gh api "repos/$GITHUB_REPOSITORY/compare/$latest...$GITHUB_SHA" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " (" + .sha[0:7] + ")"')
          else
            notes="Initial release."
          fi
          gh release create "$version" --target "$GITHUB_SHA" --title "$version" --notes "$notes"
          echo "Released $version" >> "$GITHUB_STEP_SUMMARY"